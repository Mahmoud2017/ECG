name: ecg_app
description: CardioPulse MD Workstation — AI-assisted 12-lead ECG analysis (recovered from app-release.apk v1.0.0).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

# Dependency list recovered from the package: URIs inside libapp.so.
# Versions are NOT recoverable from a release build — these are recent known-good
# versions. Run `flutter pub upgrade --major-versions` if resolution fails.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  supabase_flutter: ^2.9.0
  go_router: ^16.0.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  get_it: ^8.0.3
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  intl: any
  pinput: ^5.0.1
  smooth_page_indicator: ^1.2.1
  font_awesome_flutter: 11.0.0
  image_picker: ^1.1.2
  file_picker: ^10.2.0
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash_mark.png
  color_dark: "#0B1220"
  android_12:
    image: assets/images/splash_mark.png
    color: "#FFFFFF"
    color_dark: "#0B1220"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  remove_alpha_ios: true
